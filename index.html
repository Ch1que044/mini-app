<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101312">
<title>НИВА — каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#101312;--panel:#181c19;--panel2:#202520;--line:rgba(221,190,130,.18);--gold:#d3b477;--cream:#f0eadf;--muted:#9b9c92;--green:#34483d;--nav:68px;--safe:env(safe-area-inset-bottom,0px);--serif:"Cormorant Garamond",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}body{padding-bottom:calc(var(--nav) + var(--safe) + 18px)}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.screen{display:none;min-height:100dvh;padding-bottom:30px}.screen.active{display:block;animation:appear .28s ease}@keyframes appear{from{opacity:0;transform:translateY(5px)}}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 15px) 20px 13px}.brand{font:600 25px var(--serif);letter-spacing:.28em;margin:0}.status{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}.hero{padding:12px 20px 22px}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}.hero h2{font:500 34px/1.03 var(--serif);margin:10px 0 7px;max-width:290px}.hero p{font-size:13px;line-height:1.5;color:var(--muted);margin:0;max-width:310px}
.search-wrap{position:sticky;top:0;z-index:5;background:rgba(16,19,18,.96);backdrop-filter:blur(15px);padding:0 20px 11px}.search{height:46px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:11px;padding:0 13px}.search svg{width:18px;color:var(--muted);flex:none}.search input{width:100%;border:0;outline:0;background:transparent;font-size:14px}.search input::placeholder{color:#777a72}.chips{display:flex;gap:8px;overflow:auto;padding:3px 20px 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{height:34px;white-space:nowrap;border:1px solid var(--line);background:none;color:var(--muted);padding:0 14px;font-size:12px;border-radius:30px}.chip.active{color:#171814;background:var(--gold);border-color:var(--gold);font-weight:600}
.list{padding:2px 20px 24px;display:grid;gap:12px}.card{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;padding:10px;border:1px solid rgba(255,255,255,.055);background:linear-gradient(135deg,#191d1a,#141715);border-radius:4px;min-height:132px}.photo{position:relative;width:112px;height:112px;overflow:hidden;background:#252b26}.photo img{width:100%;height:100%;object-fit:cover;display:block}.card-copy{min-width:0;display:flex;flex-direction:column;align-self:stretch;padding:4px 1px}.product-cat{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--gold)}.product-name{font:600 19px/1.06 var(--serif);margin:6px 0 4px}.product-note{color:var(--muted);font-size:11px;line-height:1.4}.card-foot{display:flex;align-items:end;justify-content:space-between;gap:8px;margin-top:auto;padding-top:9px}.price{font:600 19px var(--serif);white-space:nowrap}.price small{font:10px var(--sans);color:var(--muted)}.add{width:38px;height:38px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:22px;font-weight:300}.stepper{display:flex;height:36px;align-items:center;border:1px solid var(--gold);color:var(--gold)}.stepper button{width:32px;height:34px;border:0;background:none;color:var(--gold);font-size:20px}.stepper b{min-width:46px;text-align:center;font-size:11px;font-weight:600}.empty{text-align:center;color:var(--muted);padding:42px 12px;line-height:1.6}
.bottom-nav{position:fixed;z-index:20;bottom:0;left:0;right:0;height:calc(var(--nav) + var(--safe));padding-bottom:var(--safe);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(18,21,19,.97);border-top:1px solid var(--line);backdrop-filter:blur(18px)}.nav-btn{position:relative;border:0;background:none;color:#888b82;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.nav-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}.nav-btn.active{color:var(--gold)}.badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:99px;background:var(--gold);color:#191914;font-size:10px;display:none;align-items:center;justify-content:center;padding:0 4px}.badge.show{display:flex}.cart-cta{position:fixed;z-index:15;left:14px;right:14px;bottom:calc(var(--nav) + var(--safe) + 9px);display:none;align-items:center;justify-content:space-between;border:0;background:var(--gold);color:#151612;padding:0 17px;height:52px;text-align:left;box-shadow:0 7px 24px #0007}.cart-cta.show{display:flex}.cart-cta span{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}.cart-cta b{font:700 20px var(--serif)}
.section-head{padding:10px 20px 17px}.section-head h2{font:500 34px var(--serif);margin:7px 0 0}.pad{padding:0 20px}.cart-list{display:grid;gap:9px}.cart-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:14px 0}.cart-row-name{font:600 19px var(--serif)}.cart-row-meta{font-size:11px;color:var(--muted);margin-top:4px}.sum{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:17px 0 4px;margin-top:10px}.sum span{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}.sum b{font:600 27px var(--serif)}.hint{font-size:11px;line-height:1.5;color:var(--muted)}.label{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin:18px 0 2px}.field{width:100%;height:48px;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:15px;padding:0;outline:0}.field::placeholder{color:#7f8279}.field:focus{border-color:var(--gold)}textarea.field{height:72px;padding-top:12px;resize:vertical}.submit{height:54px;width:100%;border:0;background:var(--gold);color:#151612;text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:700;margin:24px 0 12px}.submit:disabled{opacity:.6}.notice{padding:12px 14px;background:var(--panel);font-size:12px;line-height:1.5;color:var(--muted);margin:12px 0}.notice.error{color:#f0a696;border:1px solid #8b4d40}.success{display:none;text-align:center;padding:55px 25px}.success.show{display:block}.success h2{font:500 34px var(--serif)}.contact-list{padding:0 20px}.contact-row{display:flex;align-items:center;justify-content:space-between;min-height:64px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--cream)}.contact-row small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.contact-row em{font-style:normal;color:var(--gold);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
@media(min-width:600px){body{max-width:520px;margin:0 auto;border-left:1px solid #ffffff0a;border-right:1px solid #ffffff0a}.bottom-nav{left:50%;right:auto;width:520px;transform:translateX(-50%)}.cart-cta{left:calc(50% - 246px);right:auto;width:492px}}
</style></head>
<body>
<main>
<section class="screen active" id="screen-catalog">
 <header class="top"><h1 class="brand">НИВА</h1><span class="status">Оптовые поставки</span></header>
 <div class="hero"><span class="eyebrow">Выбор для вашего дела</span><h2>Море качества<br>в каждой поставке</h2><p>Рыба, морепродукты и икра с индивидуальными условиями для бизнеса.</p></div>
 <div class="search-wrap"><label class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Найти в каталоге" autocomplete="off"></label></div>
 <div class="chips" id="categories"></div><div class="list" id="products"></div>
</section>
<section class="screen" id="screen-cart">
 <header class="top"><h1 class="brand">НИВА</h1><span class="status">Ваш заказ</span></header>
 <div class="section-head"><span class="eyebrow">Заявка менеджеру</span><h2>Корзина</h2></div>
 <div class="pad" id="cart-content"></div>
</section>
<section class="screen" id="screen-contacts">
 <header class="top"><h1 class="brand">НИВА</h1><span class="status">На связи</span></header>
 <div class="section-head"><span class="eyebrow">Поможем с выбором</span><h2>Контакты</h2></div>
 <div class="contact-list" id="contacts"></div>
</section>
</main>
<button class="cart-cta" id="cart-cta"><span id="cta-label">Перейти к заказу</span><b id="cta-sum"></b></button>
<nav class="bottom-nav" aria-label="Разделы"><button class="nav-btn active" data-screen="catalog"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Каталог</button><button class="nav-btn" data-screen="cart"><span class="badge" id="badge"></span><svg viewBox="0 0 24 24"><path d="M5 7h14l-1 14H6L5 7Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Корзина</button><button class="nav-btn" data-screen="contacts"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>Контакты</button></nav>
<script>
const CONFIG={phone:'+79315901488',email:'nivafishspb@mail.ru',telegram:'https://t.me/+79315901488'};
const products=[
 {id:1,cat:'Икра',name:'Икра красная лососевая',note:'Крупное зерно · классический посол',price:5200,unit:'кг',step:1,min:5,art:'roe'},
 {id:2,cat:'Икра',name:'Икра горбуши',note:'Мягкий посол · отборное зерно',price:4600,unit:'кг',step:1,min:5,art:'roe'},
 {id:3,cat:'Икра',name:'Икра осетровая',note:'Премиальная коллекция · наличие уточняйте',price:null,unit:'кг',step:.5,min:1,art:'roe'},
 {id:4,cat:'Красная рыба',name:'Сёмга охлаждённая',note:'Тушка 4–5 кг · потрошёная',price:1190,unit:'кг',step:5,min:10,art:'fish'},
 {id:5,cat:'Красная рыба',name:'Форель слабосолёная',note:'Филе-кусок · вакуумная упаковка',price:1450,unit:'кг',step:2,min:6,art:'fish'},
 {id:6,cat:'Красная рыба',name:'Кета свежемороженая',note:'Потрошёная · без головы',price:640,unit:'кг',step:5,min:10,art:'fish'},
 {id:7,cat:'Белая рыба',name:'Осётр охлаждённый',note:'Тушка · потрошёная',price:2400,unit:'кг',step:2,min:6,art:'fish'},
 {id:8,cat:'Белая рыба',name:'Судак, филе',note:'Без кожи и костей',price:780,unit:'кг',step:5,min:10,art:'fish'},
 {id:9,cat:'Морепродукты',name:'Креветки 50/70',note:'Варёно-мороженые · калибр 50/70',price:890,unit:'кг',step:5,min:10,art:'shell'},
 {id:10,cat:'Морепродукты',name:'Мидии в раковине',note:'Варёно-мороженые',price:520,unit:'кг',step:5,min:10,art:'shell'}
];
const phone=CONFIG.phone, email=CONFIG.email, tg=window.Telegram?.WebApp;
const artSvg=(kind,index)=>{const tones=[['#24352e','#bda16d'],['#28332e','#d3b477'],['#24312e','#a8a37a'],['#24342f','#c2a66e']][index%4];let shape=kind==='shell'?'<path d="M43 108c1-30 18-54 47-61 29 7 47 31 48 61-28 19-67 19-95 0Z"/><path d="M90 49v65m0-65L61 110m29-61 29 61m-58-30 58 0"/>':kind==='roe'?'<circle cx="90" cy="85" r="37"/><circle cx="75" cy="72" r="3"/><circle cx="98" cy="68" r="3"/><circle cx="111" cy="86" r="3"/><circle cx="81" cy="94" r="3"/><circle cx="101" cy="105" r="3"/><circle cx="66" cy="84" r="3"/><circle cx="91" cy="83" r="3"/>':'<path d="M38 88c22-28 62-39 102-17l20-15-4 29 4 26-20-14c-40 24-80 13-102-9Z"/><circle cx="62" cy="83" r="2" fill="#d3b477"/>';
return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="${tones[0]}"/><stop offset="1" stop-color="#131816"/></linearGradient></defs><rect width="180" height="150" fill="url(#g)"/><path d="M0 119Q45 98 90 119t90 0v31H0Z" fill="#ffffff08"/><g fill="none" stroke="${tones[1]}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${shape}</g><path d="M18 18h24" stroke="${tones[1]}" opacity=".55"/><circle cx="151" cy="24" r="2" fill="${tones[1]}" opacity=".6"/></svg>`)}`};
let cart={};try{cart=JSON.parse(localStorage.getItem('nivaCart')||'{}')}catch{}
let category='Все',query='',current='catalog';const $=id=>document.getElementById(id),money=n=>Math.round(n).toLocaleString('ru-RU')+' ₽',product=id=>products.find(p=>p.id===Number(id));
function count(){return Object.keys(cart).length}function total(){return Object.entries(cart).reduce((s,[id,q])=>s+(product(id)?.price||0)*q,0)}function hasAsk(){return Object.keys(cart).some(id=>!product(id)?.price)}function orderSum(){return total()?money(total())+(hasAsk()?' +':''):hasAsk()?'По запросу':'0 ₽'}
function save(){try{localStorage.setItem('nivaCart',JSON.stringify(cart))}catch{}}
function renderCategories(){const cats=['Все',...new Set(products.map(p=>p.cat))];$('categories').innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('')}
function control(p){const q=cart[p.id];return q?`<div class="stepper"><button aria-label="Уменьшить" data-minus="${p.id}">−</button><b>${q} ${p.unit}</b><button aria-label="Увеличить" data-plus="${p.id}">+</button></div>`:`<button class="add" aria-label="Добавить ${p.name}" data-plus="${p.id}">+</button>`}
function renderProducts(){const list=products.filter(p=>(category==='Все'||p.cat===category)&&(p.name+' '+p.note+' '+p.cat).toLowerCase().includes(query));$('products').innerHTML=list.length?list.map((p,i)=>`<article class="card" style="animation-delay:${i*25}ms"><div class="photo"><img src="${artSvg(p.art,p.id)}" alt="Заглушка изображения: ${p.name}"></div><div class="card-copy"><span class="product-cat">${p.cat}</span><div class="product-name">${p.name}</div><div class="product-note">от ${p.min} ${p.unit} · ${p.note}</div><div class="card-foot"><div class="price">${p.price?money(p.price)+'<small> / '+p.unit+'</small>':'<small>Цена по запросу</small>'}</div>${control(p)}</div></div></article>`).join(''):'<div class="empty">По вашему запросу ничего не найдено.<br>Попробуйте изменить поиск.</div>'}
function renderCart(){const entries=Object.entries(cart).filter(([,q])=>q>0);if(!entries.length){$('cart-content').innerHTML='<div class="empty">Корзина пока пуста.<br>Добавьте товары из каталога.</div><button class="submit" id="go-catalog">Открыть каталог</button>';return} $('cart-content').innerHTML=`<div class="cart-list">${entries.map(([id,q])=>{const p=product(id);return `<div class="cart-row"><div><div class="cart-row-name">${p.name}</div><div class="cart-row-meta">${p.price?money(p.price)+' / '+p.unit+' · '+money(p.price*q):'Цена по запросу'} · от ${p.min} ${p.unit}</div></div>${control(p)}</div>`}).join('')}</div><div class="sum"><span>Предварительная сумма</span><b>${orderSum()}</b></div><p class="hint">Точную стоимость, наличие и доставку подтвердит менеджер.</p><form id="order-form"><label class="label" for="customer-name">Как к вам обращаться *</label><input class="field" id="customer-name" name="name" placeholder="Имя" autocomplete="name" required minlength="2"><label class="label" for="customer-phone">Телефон для связи *</label><input class="field" id="customer-phone" name="phone" type="tel" placeholder="+7 (___) ___-__-__" autocomplete="tel" required minlength="7"><label class="label" for="company">Компания</label><input class="field" id="company" name="company" placeholder="Название компании"><label class="label" for="city">Город доставки</label><input class="field" id="city" name="city" placeholder="Город"><label class="label" for="comment">Комментарий</label><textarea class="field" id="comment" name="comment" placeholder="Удобное время, пожелания к заказу"></textarea><div class="notice" id="order-notice">Имя и телефон будут отправлены менеджеру вместе с заказом.</div><button class="submit" id="submit-order" type="submit">Отправить заказ менеджеру</button></form>`;$('order-form').onsubmit=submitOrder}
function renderContacts(){$('contacts').innerHTML=`<a class="contact-row" href="tel:${phone}"><span>Телефон<small>${phone}</small></span><em>Позвонить ↗</em></a><a class="contact-row" href="https://wa.me/${phone.replace(/\D/g,'')}"><span>WhatsApp<small>${phone}</small></span><em>Написать ↗</em></a><a class="contact-row" href="${CONFIG.telegram}"><span>Telegram<small>Связаться с менеджером</small></span><em>Открыть ↗</em></a><a class="contact-row" href="mailto:${email}"><span>Электронная почта<small>${email}</small></span><em>Написать ↗</em></a>`}
function refresh(){save();renderProducts();if(current==='cart')renderCart();const n=count(),badge=$('badge');badge.textContent=n;badge.classList.toggle('show',n>0);$('cart-cta').classList.toggle('show',n>0&&current==='catalog');$('cta-sum').textContent=orderSum();$('cta-label').textContent=`К заказу · ${n} поз.`}
function show(name){current=name;document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id==='screen-'+name));document.querySelectorAll('.nav-btn').forEach(e=>e.classList.toggle('active',e.dataset.screen===name));$('cart-cta').classList.toggle('show',count()>0&&name==='catalog');if(name==='cart')renderCart();window.scrollTo(0,0)}
function change(id,delta){const p=product(id);if(!p)return;let q=Number(cart[id]||0);q+=delta*p.step;if(delta>0&&!cart[id])q=p.min;if(q<p.min)q=0;if(q)cart[id]=Math.round(q*10)/10;else delete cart[id];refresh()}
async function submitOrder(event){event.preventDefault();const form=event.currentTarget;if(!form.reportValidity())return;const data=new FormData(form),items=Object.entries(cart).map(([id,q])=>{const p=product(id);return {id:p.id,name:p.name,quantity:q,unit:p.unit,price:p.price}});if(!items.length)return;const order={name:String(data.get('name')).trim(),phone:String(data.get('phone')).trim(),company:String(data.get('company')).trim(),city:String(data.get('city')).trim(),comment:String(data.get('comment')).trim(),items,total:total(),currency:'RUB',createdAt:new Date().toISOString(),telegramUser:tg?.initDataUnsafe?.user?{id:tg.initDataUnsafe.user.id,username:tg.initDataUnsafe.user.username,first_name:tg.initDataUnsafe.user.first_name}:null};const notice=$('order-notice'),button=$('submit-order');button.disabled=true;button.textContent='Отправляем…';notice.className='notice';notice.textContent='Передаём заказ менеджеру…';try{const response=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''},body:JSON.stringify(order)});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'Не удалось отправить заказ.');cart={};save();refresh();$('cart-content').innerHTML=`<div class="success show"><span class="eyebrow">Заказ получен</span><h2>Спасибо, ${escapeHtml(order.name)}!</h2><p class="hint">Ваш заказ отправлен менеджеру. Мы свяжемся с вами для подтверждения состава и условий поставки.</p><button class="submit" id="back-to-catalog">Продолжить покупки</button></div>`;$('back-to-catalog').onclick=()=>show('catalog')}catch(error){notice.className='notice error';notice.textContent=error.message.includes('Failed to fetch')||error.message.includes('404')?'Отправка пока не настроена. Откройте мини-приложение через Telegram-бота и проверьте серверную настройку заказов.':error.message;button.disabled=false;button.textContent='Повторить отправку'}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('click',e=>{const p=e.target.closest('[data-plus]'),m=e.target.closest('[data-minus]'),c=e.target.closest('[data-cat]'),n=e.target.closest('[data-screen]');if(p){e.stopPropagation();change(p.dataset.plus,1)}else if(m){e.stopPropagation();change(m.dataset.minus,-1)}else if(c){category=c.dataset.cat;renderCategories();renderProducts()}else if(n)show(n.dataset.screen);else if(e.target.closest('#cart-cta'))show('cart');else if(e.target.closest('#go-catalog'))show('catalog')});$('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderProducts()});
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#101312');tg.setBackgroundColor('#101312');tg.disableVerticalSwipes?.()}catch{}}
renderCategories();renderProducts();renderContacts();refresh();
</script></body></html>

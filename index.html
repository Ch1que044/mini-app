.ph{aspect-ratio:16/10;position:relative;overflow:hidden;border:1px solid var(--ln);background:var(--sf2)}.ph img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}.ph .nf{font-size:72px}
.sh2{font-family:var(--sr);font-size:30px;font-weight:600;margin:16px 0 4px;line-height:1.1}
.sp2{width:100%;border-collapse:collapse;margin:14px 0}.sp2 td{padding:11px 0;border-bottom:1px solid var(--ln);font-size:14px}.sp2 td:first-child{color:var(--mu);width:44%}
.ok{text-align:center;padding:18px 0}.ok h2{font-family:var(--sr);font-weight:500;font-size:30px;margin:10px 0}
.ln{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:dr 1.2s var(--ez) both}@keyframes dr{from{transform:scaleX(0)}}
</style></head><body>

 <div class="hd"><h1 class="wm">НИВА</h1><span class="lbl">Опт · рыба · икра</span></div>

<script>
// ===== НАСТРОЙКИ =====
const C={phone:'+79315901488',email:'nivafishspb@mail.ru',wa:'79315901488',tg:'https://t.me/+79315901488'};

const PRODUCTS=[
{id:1,cat:'Икра',n:'Икра красная лососевая',d:'Крупное целое зерно, классический посол.',p:5200,u:'кг',st:1,min:5,img:IC,s:[['Вид','Красная лососевая'],['Посол','Классический']]},
{id:2,cat:'Икра',n:'Икра горбуши',d:'Мягкий посол, ястычная.',p:4600,u:'кг',st:1,min:5,img:IC,s:[['Вид','Горбуша'],['Посол','Мягкий']]},
{id:3,cat:'Икра',n:'Икра осетровая',d:'Премиальный сегмент. Цену и наличие уточняйте у менеджера.',p:null,u:'кг',st:.5,min:1,img:null,s:[['Вид','Осетровая']]},
{id:4,cat:'Красная рыба',n:'Сёмга охлаждённая',d:'Тушка 4–5 кг, потрошёная.',p:1190,u:'кг',st:5,min:10,img:IS,s:[['Форма','Охлаждённая'],['Размер','Тушка 4–5 кг']]},
{id:5,cat:'Красная рыба',n:'Форель слабосолёная',d:'Филе-кусок, вакуумная упаковка.',p:1450,u:'кг',st:2,min:6,img:IS,s:[['Форма','Слабосолёная'],['Упаковка','Вакуум']]},
{id:6,cat:'Красная рыба',n:'Кета свежемороженая',d:'Потрошёная, без головы.',p:640,u:'кг',st:5,min:10,img:null,s:[['Форма','Свежемороженая']]},
{id:7,cat:'Белая рыба',n:'Осётр охлаждённый',d:'Тушка, потрошёная.',p:2400,u:'кг',st:2,min:6,img:null,s:[['Форма','Охлаждённая']]},
{id:8,cat:'Белая рыба',n:'Судак, филе',d:'Без кожи и костей.',p:780,u:'кг',st:5,min:10,img:null,s:[['Форма','Филе']]},
{id:9,cat:'Морепродукты',n:'Креветки 50/70',d:'Варёно-мороженые.',p:890,u:'кг',st:5,min:10,img:null,s:[['Калибр','50/70'],['Форма','Варёно-мороженые']]},
{id:10,cat:'Морепродукты',n:'Мидии в раковине',d:'Варёно-мороженые.',p:520,u:'кг',st:5,min:10,img:null,s:[['Форма','Варёно-мороженые']]}];
const tg=window.Telegram&&Telegram.WebApp,hap=t=>{try{tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0b0c0e');tg.setBackgroundColor('#0b0c0e');tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
let cart={},cat='Все',qs='',view='cat',F={nm:'',ph:'',cp:'',ci:'',cm:'',type:'Ресторан',fq:'Разово',sm:false};
try{cart=JSON.parse(localStorage.getItem('nivaCart')||'{}')}catch(e){}
const $=i=>document.getElementById(i),P=i=>PRODUCTS.find(x=>x.id==i),R=n=>Math.round(n).toLocaleString('ru-RU')+' ₽',save=()=>{try{localStorage.setItem('nivaCart',JSON.stringify(cart))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sub=()=>Object.entries(cart).reduce((s,[i,q])=>s+(P(i).p||0)*q,0),cnt=()=>Object.keys(cart).length,kg=()=>Object.entries(cart).reduce((s,[i,q])=>s+(P(i).u=='кг'?q:0),0),hasReq=()=>Object.keys(cart).some(i=>!P(i).p);

const CATS=['Все',...new Set(PRODUCTS.map(p=>p.cat))];

function msg(kind){if(kind=='price')return 'Здравствуйте! Прошу прислать актуальный прайс-лист на оптовые поставки рыбы и икры.'+(F.nm?'\nИмя: '+F.nm:'')+(F.ph?'\nТелефон: '+F.ph:'');
const l=Object.entries(cart).map(([i,q])=>`— ${P(i).n}: ${q} ${P(i).u}`);return `Заявка ООО «Нива»\n${l.join('\n')}\n${sub()?'Ориентировочно: '+total()+'\n':''}Тип клиента: ${F.type}\nПоставка: ${F.fq}\nГород: ${F.ci||'—'}\nОбразцы: ${F.sm?'да':'нет'}\nИмя: ${F.nm}\nКомпания: ${F.cp||'—'}\nТелефон: ${F.ph}\nКомментарий: ${F.cm||'—'}`}
function go(u){if(/^https:\/\/t\.me/.test(u)&&tg)tg.openTelegramLink(u);else if(/^https?:/.test(u)){tg?tg.openLink(u):window.open(u,'_blank')}else location.href=u}
let sheetId=0;
function openSh(h){$('sh').innerHTML='<div class="gr"></div>'+h;$('ov').classList.add('show');$('sh').classList.add('show');$('sh').scrollTop=0;try{tg.BackButton.show();tg.BackButton.onClick(closeSh)}catch(e){}}
function closeSh(){$('ov').classList.remove('show');$('sh').classList.remove('show');sheetId=0;try{tg.BackButton.hide();tg.BackButton.offClick(closeSh)}catch(e){}}
function drawDetail(id){const p=P(id);$('sh').innerHTML='<div class="gr"></div>'+`${thumb(p,1)}<div class="sh2">${p.n}</div><p class="nt" style="font-size:14px">${p.d}</p><table class="sp2">${[...p.s,['Минимальный заказ',p.min+' '+p.u],['Шаг заказа',p.st+' '+p.u],['Цена',p.p?'от '+R(p.p)+' / '+p.u:'По запросу']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table><div data-o="${id}" style="display:flex;justify-content:flex-end;margin-bottom:${cart[id]?0:-16}px;${cart[id]?'':'height:0;overflow:hidden'}"><div class="ctl">${ctl(p)}</div></div><button class="bt" id="dc" style="width:100%;margin-top:16px">${cart[id]?'Готово':'В заявку'}</button>`;$('dc').onclick=()=>{if(!cart[id])chg(id,1);closeSh()}}
function openDetail(id){sheetId=id;drawDetail(id);$('ov').classList.add('show');$('sh').classList.add('show');$('sh').scrollTop=0;try{tg.BackButton.show();tg.BackButton.onClick(closeSh)}catch(e){}}
function choose(kind){openSh(`<span class="lbl">Отправка</span><h2 class="t">Куда отправить?</h2><p class="nt" style="margin-bottom:8px">${kind=='price'?'Запрос прайс-листа':'Заявка'} поступит напрямую менеджеру.</p>${[['WhatsApp',C.phone,'wa'],['Telegram',C.phone,'tg'],['Почта',C.email,'em']].map(x=>`<button class="lk" data-s="${x[2]}" data-k="${kind}"><div>${x[0]}<small>${x[1]}</small></div><span>→</span></button>`).join('')}`)}
function send(k,kind){const t=msg(kind);try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}
if(k=='wa')go('https://wa.me/'+C.wa+'?text='+encodeURIComponent(t));else if(k=='em')go('mailto:'+C.email+'?subject='+encodeURIComponent(kind=='price'?'Запрос прайс-листа':'Заявка с мини-приложения НИВА')+'&body='+encodeURIComponent(t));else{try{navigator.clipboard.writeText(t)}catch(e){}go(C.tg)}
$('sh').innerHTML=`<div class="gr"></div><div class="ok"><div class="ln" style="width:60px;margin:6px auto"></div><span class="lbl">Готово</span><h2>${k=='tg'?'Текст скопирован':'Всё готово'}</h2><p class="nt">${k=='tg'?'Вставьте его в открывшийся чат с менеджером.':'Отправьте сообщение в открывшемся окне — менеджер свяжется с вами.'}</p><button class="bt" id="cl" style="width:100%;margin-top:18px">Закрыть</button></div>`;$('cl').onclick=()=>{closeSh();if(kind=='order'){cart={};save();drawList();upd();drawReq()}}}
$('ctc').innerHTML=`<p class="nt" style="font-size:14px;margin-bottom:10px">Условия поставки — объём, периодичность, доставка — согласуем индивидуально.</p>${[['Телефон',C.phone,'tel:'+C.phone,'Звонок'],['WhatsApp',C.phone,'https://wa.me/'+C.wa,'Написать'],['Telegram',C.phone,C.tg,'Написать'],['Почта',C.email,'mailto:'+C.email,'Письмо']].map(x=>`<a class="lk" data-h="${x[2]}" href="${x[2]}"><div>${x[0]}<small>${x[1]}</small></div><span>${x[3]}</span></a>`).join('')}`;
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-m],[data-c],[data-v],[data-h],[data-f],[data-s],[data-o]');if(!t)return;
if(t.dataset.a){e.stopPropagation();chg(+t.dataset.a,1)}else if(t.dataset.m){e.stopPropagation();chg(+t.dataset.m,-1)}
else if(t.dataset.h){e.preventDefault();go(t.dataset.h)}else if(t.dataset.s)send(t.dataset.s,t.dataset.k)
else if(t.dataset.f){keep();F[t.dataset.f]=t.dataset.v;t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b==t));hap('soft')}
else if(t.dataset.c){cat=t.dataset.c;hap('soft');drawCh();drawList()}else if(t.dataset.v&&t.closest('nav'))show(t.dataset.v)
else if(t.dataset.o&&t.classList.contains('rw'))openDetail(+t.dataset.o)});
let tm;$('q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{qs=e.target.value.toLowerCase().trim();drawList()},150)};
$('qp').onclick=()=>choose('price');$('qc').onclick=()=>go('tel:'+C.phone);$('bar').onclick=()=>show('req');$('ov').onclick=closeSh;
drawCh();drawList();upd();
</script></body></html>
